name: Android release

# GDPRLetterBuilder's release workflow, adapted on 29 October 2026 from EclipseTracker's
# (StormberryAS/EclipseTracker, released 2.0.0 on 17 October 2026 with it), itself from
# CheckLink's (released 0.0.1 on 15 October 2026): the same two jobs, the same pinned actions,
# the same order of checks. What differs: no permission at all (expected-permissions.txt holds
# only the package line), this app's web file list (WebAssets.INCLUDES less WebAssets.LEFT_OUT in
# android/app/build.gradle.kts), its licences under assets/licences/, its file name
# gdprletterbuilder-v<version>.apk, and its certificate: the release key exists (created on
# 30 October 2026), and EXPECTED_CERT below holds its certificate's SHA-256.
#
# IT HAS NOT RUN: the repository is on GitHub (main since 30 October 2026), but no android-v* tag
# exists yet.
#
# Tagged android-v* only, and nothing else starts it: there is no manual run, so no branch can
# ever reach the signing secrets. The repository will also serve the website gdpr.stormberry.as
# from main through GitHub Pages; the prefix keeps app releases apart from anything else.
#
# TWO JOBS, so that build tools never come near the app's signing key or GitHub's signing token:
#
#   build    runs the TypeScript check, the unit tests, the web checks and lint, and has Gradle
#            build the release APK UNSIGNED. It can only read the repository: no secret, no key,
#            no password, and no token that can write or sign anything. Gradle, Node and
#            everything they download run here and nowhere else.
#
#   release  runs NO Gradle, no Node and no code from the build. It takes the unsigned APK as
#            data and checks it BEFORE the key is decoded: no permission but the package line,
#            no INTERNET, not debuggable, the version the tag names, every web file in it byte
#            for byte against the tagged commit, and the licence texts. Then it aligns and signs
#            that same file with Google's zipalign and apksigner, using the permanent key from
#            the "release" environment, and checks the result: one signer, GDPRLetterBuilder's
#            pinned certificate, and the same files as the APK it checked. Only then does it
#            attest and publish. The tokens that write (contents) and sign the provenance record
#            (id-token) exist in this job alone.
#
# What the split does not cover: the release job signs the code the build job compiled, so a
# build dependency that went bad could still put its own code into classes.dex. The checks cover
# the permissions, the manifest's flags and the web files, not the compiled code. The build is
# reproducible (the same sha256 twice, stage 3 and 29 October 2026), so a second, independent
# build can be compared with any release (README.md, "Reproducible build").
#
# SET-UP ON GITHUB, before the first tag (repository Settings), made by the release batch and
# read back by it:
#   1. Environment "release", deployment rule: tags matching android-v* only, no branch rule.
#   2. Its secrets: KEYSTORE_BASE64 (the .p12 file, base64), KEYSTORE_PASSWORD, KEY_ALIAS,
#      KEY_PASSWORD. None of them as a repository secret.
#   3. Required reviewers on that environment: Marcos's two accounts, so each release waits for
#      one click on the run's page before the key is handed over.
#   4. A tag ruleset for android-v*: creation, update and deletion restricted, organisation admins
#      (Marcos's two accounts) may bypass. GitHub runs the workflow file of the tagged commit, so
#      without 3 and 4 anyone who could push such a tag could point it at a commit whose release
#      job sends the key elsewhere.
#   5. EXPECTED_CERT below: the SHA-256 of the release certificate
#      (~/.android-keys/stormberry-gdprletterbuilder-release.p12, alias release), written in on
#      30 October 2026, before the first android-v* tag.
on:
  push:
    tags: ["android-v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android

    # Every action is pinned to a full commit hash, with its release in the comment, the same pins
    # as EclipseTracker's and CheckLink's workflows. A tag such as v6 can be moved to other code; a
    # commit hash cannot. setup-gradle matters most here: it installs an init script into every
    # later Gradle run. To update a pin, resolve the new release with
    #   git ls-remote https://github.com/<owner>/<repo>.git 'refs/tags/<tag>*'
    # and take the ^{} line for an annotated tag. Only a stable release, and only once it is 3 days
    # old, unless it fixes a security problem that reaches this workflow (rule since 2026-10-22).
    steps:
      # No credentials are left in .git/config for the build to find. Only HEAD is needed (the
      # release check compares the bundled web files with the committed ones), so no history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The store texts (fastlane/ and zapstore.yaml), the Android sections of privacy.html and the
      # README's Android section were written as DRAFTs on 29 October 2026, each marked by a line
      # that says so. zsp publishes the store texts as they are and the APK carries privacy.html,
      # so no release may be built while one still carries that line: Marcos approves the text
      # and removes it.
      - name: Refuse to release while a text is marked DRAFT
        working-directory: .
        run: |
          set -euo pipefail
          if grep -rln 'DRAFT, not approved' fastlane zapstore.yaml privacy.html README.md; then
            echo "::error::the files above are still marked DRAFT; approve the texts and remove the DRAFT lines first"
            exit 1
          fi
          echo "No text is marked DRAFT."

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Node 24 for the TypeScript checks below: the compiled JavaScript, the Android bridge
      # (android-bridge.js, compiled from android-bridge.ts and committed) and the unit tests, which
      # Node 24 runs directly. No npm cache: nothing another run left behind may change what this
      # build reads. The Gradle build itself never runs Node or tsc.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # No Gradle cache: nothing another run left behind can change what this build reads.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The runner ships an Android SDK, but not necessarily platform 37.1, and its bundled
      # sdkmanager may be too old to know that package exists. Refresh cmdline-tools first.
      - name: Install SDK packages the runner may not have
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "cmdline-tools;latest" > /dev/null
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0"

      # tools/build-ts.sh --check installs the pinned TypeScript with npm ci (frozen, no install
      # scripts) and fails unless app.js, src/*.js and android/web-overlay/android-bridge.js are
      # byte for byte what their TypeScript compiles to (stamps aside), the modules, the bridge and
      # the tests type-check, every golden letter is what the compiled modules write and every ?v=
      # stamp is current (bump_assets.py --check; python3 is on the runner). Some unit tests read
      # only the TypeScript source, so they speak for what ships only together with this check.
      # Then the unit tests, among them S-1: the only JavaScript in the repository is that compiled
      # output (gate.js included, compiled from ts/gate.ts since 0.0.2). The spec and the shared
      # generators are not beside a CI checkout, so the tests that need them skip, and so does the
      # one that reads a local Android build.
      - name: Check the compiled TypeScript and run the unit tests
        working-directory: .
        run: |
          set -euo pipefail
          node --version
          tools/build-ts.sh --check
          node --test tests/*.test.ts

      # verifyWebAssets fails unless every bundled web file is byte-identical to the one GitHub
      # Pages serves (index.html may differ only by the single injected bridge line);
      # verifyWebAssetsCommitted fails unless each also equals the copy in the tagged commit (on a
      # CI runner it also fails when there is no git checkout). The unit tests are the Kotlin
      # tests of the asset handler, the navigation policy, printing, saving and the calendar event.
      - name: Test, check the bundled web app and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:verifyWebAssets :app:verifyWebAssetsCommitted :app:lintRelease

      # -PunsignedRelease=true is the only way the build makes a release APK without signing it,
      # and the build refuses it if a signing password is anywhere in reach.
      - name: Build the release APK, unsigned
        run: ./gradlew --no-daemon -PunsignedRelease=true :app:assembleRelease

      # Only the APK leaves this job. The release job checks everything else against the tagged
      # commit itself, so nothing else the build wrote is trusted.
      - name: Make sure it is unsigned, and set it aside
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -s "$APK" ] || { echo "::error::$APK was not built"; exit 1; }
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" > /dev/null 2>&1; then
            echo "::error::the build job made a signed APK; it must never hold a key"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/handover"
          cp "$APK" "$RUNNER_TEMP/handover/gdprletterbuilder-unsigned.apk"
          sha256sum "$RUNNER_TEMP/handover/gdprletterbuilder-unsigned.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdprletterbuilder-unsigned
          path: ${{ runner.temp }}/handover/gdprletterbuilder-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, which only android-v* tags may use, and
    # which waits for one of the required reviewers before this job starts.
    environment: release
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # publish it
    defaults:
      run:
        working-directory: android

    # No Gradle, no Node, no setup-gradle and no build output but the APK. Every tool here is
    # Google's (zipalign, apksigner, aapt2 from build-tools 36.0.0) or the runner's own.
    steps:
      # The tagged commit, for expected-permissions.txt, LICENSE, NOTICE and the web files the APK
      # must carry byte for byte. Nothing in it is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build-tools 36.0.0 (zipalign, apksigner, aapt2)
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0"
          for t in zipalign apksigner aapt2; do
            [ -x "$ANDROID_HOME/build-tools/36.0.0/$t" ] || { echo "::error::build-tools 36.0.0 has no $t"; exit 1; }
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gdprletterbuilder-unsigned
          path: ${{ runner.temp }}/handover

      # Everything about what the APK holds is checked BEFORE the key is decoded, on the very file
      # the build job handed over: a bad APK never comes near the key.
      - name: Check the unsigned APK (permissions, debuggable, version, web files and licences)
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/handover/gdprletterbuilder-unsigned.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          # FAIL CLOSED, in both directions: `dump permissions` must print exactly what
          # android/expected-permissions.txt holds, which is the package line and nothing else.
          # The output is compared whole, so any uses-permission or permission line fails, and so
          # does an aapt2 that cannot read the APK (set -e stops on its exit status before the
          # comparison). The privacy page, the README and the store texts all say "no
          # permissions", so this check is what keeps them true.
          DUMP=$("$AAPT" dump permissions "$APK")
          EXPECTED_PERMISSIONS=$(cat expected-permissions.txt)
          if [ "$DUMP" != "$EXPECTED_PERMISSIONS" ]; then
            echo "::error::APK permissions differ from android/expected-permissions.txt"
            echo "expected:"; printf '%s\n' "$EXPECTED_PERMISSIONS"
            echo "actual:";   printf '%s\n' "$DUMP"
            exit 1
          fi
          if printf '%s\n' "$DUMP" | grep -q "permission"; then
            echo "::error::the APK asks for a permission; GDPRLetterBuilder asks for none"; exit 1
          fi
          echo "Verified: no permission at all (exactly expected-permissions.txt), so no INTERNET."

          # A release build must never be debuggable.
          BADGING=$("$AAPT" dump badging "$APK")
          if printf '%s\n' "$BADGING" | grep -q "^application-debuggable"; then
            echo "::error::the release APK is debuggable"
            exit 1
          fi
          echo "Verified: not debuggable."

          # A tag must match the version inside the APK, or the release would publish a misnamed
          # binary that Zapstore cannot offer as an update. The package must be the sovereign one:
          # this workflow never builds the Google Play edition (no.stormberry.gdprletterbuilder.play,
          # a bundle built and signed with the Play upload key on Marcos's own machine), and an APK
          # of it must never be signed with the release key or published here.
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "APK $PACKAGE versionName $VERSION_NAME, versionCode $VERSION_CODE"
          [ "$PACKAGE" = no.stormberry.gdprletterbuilder ] || { echo "::error::the APK is $PACKAGE, not no.stormberry.gdprletterbuilder"; exit 1; }
          [ "$VERSION_CODE" -lt 1000 ] || { echo "::error::versionCode $VERSION_CODE is in the Google Play range (1000 and above)"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "v$VERSION_NAME" != "${GITHUB_REF_NAME#android-}" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the APK's versionName $VERSION_NAME; bump versionName and versionCode in android/app/build.gradle.kts"
              exit 1
            fi
            echo "Verified: tag matches versionName."
          fi

          # The licence texts, outside assets/web/: the app's own MIT licence, the Apache License
          # for the AndroidX and Kotlin libraries and THIRD-PARTY.txt, which lists them; and every
          # licence text NOTICE names (Inter's OFL), in assets/web/licences/, read from NOTICE so a
          # new one is checked without editing this list.
          for f in Apache-2.0.txt GDPRLetterBuilder-MIT.txt THIRD-PARTY.txt; do
            unzip -l "$APK" "assets/licences/$f" > /dev/null || { echo "::error::assets/licences/$f missing from the APK"; exit 1; }
          done
          unzip -p "$APK" assets/licences/GDPRLetterBuilder-MIT.txt | cmp -s - ../LICENSE \
            || { echo "::error::assets/licences/GDPRLetterBuilder-MIT.txt is not the tagged LICENSE"; exit 1; }
          NAMED=$(grep -o 'licences/[A-Za-z0-9._-]*\.txt' ../NOTICE | sort -u)
          [ -n "$NAMED" ] || { echo "::error::NOTICE names no licence files"; exit 1; }
          for f in $NAMED; do
            unzip -l "$APK" "assets/web/$f" > /dev/null || { echo "::error::assets/web/$f (named in NOTICE) missing from the APK"; exit 1; }
          done
          echo "Verified: the three licence texts are bundled, the app's own is the tagged LICENSE, and the $(printf '%s\n' "$NAMED" | wc -l) named in NOTICE."

          # EVERY web file, byte for byte, against the tagged commit and not against anything the
          # build job wrote. The expected set is the app's include list (WebAssets.INCLUDES less
          # WebAssets.LEFT_OUT in android/app/build.gradle.kts; tests/android-app.test.ts keeps the
          # two equal) read from this checkout, plus the bridge script. src/citations.js is on
          # LEFT_OUT: the page never loads it. assets/web/ must hold exactly that set; each file
          # must equal the commit's copy, index.html apart from the one injected bridge line, and
          # android-bridge.js must equal android/web-overlay/android-bridge.js, which the build job
          # proved is what android-bridge.ts compiles to.
          shopt -s globstar nullglob
          EXPECTED_WEB=$(cd .. && for f in index.html app.js style.css favicon.svg apple-touch-icon.png \
                                         privacy.html disclaimer.html disclaimer.css gate.js gate.css \
                                         src/**/*.js \
                                         fonts/**/*.css fonts/**/*.woff2 \
                                         switcher-icons/*.svg licences/*.txt; do
                           case "$f" in src/citations.js) continue ;; esac
                           [ -f "$f" ] && printf '%s\n' "$f"
                         done; echo android-bridge.js)
          EXPECTED_WEB=$(printf '%s\n' "$EXPECTED_WEB" | sort -u)
          IN_APK=$(unzip -Z1 "$APK" | sed -n 's#^assets/web/##p' | grep -v '/$' | sort -u)
          if [ "$EXPECTED_WEB" != "$IN_APK" ]; then
            echo "::error::the APK's web files are not exactly the tagged website's"
            diff <(printf '%s\n' "$EXPECTED_WEB") <(printf '%s\n' "$IN_APK") || true
            exit 1
          fi
          TAG_LINE='<script src="android-bridge.js"></script>'
          WEB_FILES=0
          while IFS= read -r f; do
            case "$f" in
              android-bridge.js)
                unzip -p "$APK" "assets/web/$f" | cmp -s - web-overlay/android-bridge.js \
                  || { echo "::error::assets/web/android-bridge.js differs from android/web-overlay"; exit 1; } ;;
              index.html)
                [ "$(unzip -p "$APK" assets/web/index.html | grep -cx "[[:space:]]*$TAG_LINE")" = 1 ] \
                  || { echo "::error::index.html must carry the bridge line exactly once"; exit 1; }
                unzip -p "$APK" assets/web/index.html | grep -vx "[[:space:]]*$TAG_LINE" | cmp -s - ../index.html \
                  || { echo "::error::index.html differs from the tagged one by more than the bridge line"; exit 1; } ;;
              *)
                unzip -p "$APK" "assets/web/$f" | cmp -s - "../$f" \
                  || { echo "::error::assets/web/$f differs from the tagged commit"; exit 1; } ;;
            esac
            WEB_FILES=$((WEB_FILES + 1))
          done <<< "$IN_APK"
          echo "Verified: all $WEB_FILES web files are the tagged website's, byte for byte (index.html apart from the bridge line)."

          # The file the next steps sign must be this one.
          sha256sum "$APK" > "$RUNNER_TEMP/checked.sha256"

      # GDPRLetterBuilder's own key (one key per app), created on 30 October 2026:
      # ~/.android-keys/stormberry-gdprletterbuilder-release.p12, PKCS12, alias release, RSA-4096
      # (spec section 14). It becomes permanent with the first Zapstore release. Without a valid
      # SHA-256 here, this step stops the release before any key is decoded. Both later checks
      # read the pin from here.
      - name: Read the pinned certificate
        id: pin
        run: |
          set -euo pipefail
          EXPECTED_CERT=8287710abd10fc1d37615299bd11c3e79306545ecc3e1b968010da54a80424e2
          if ! printf '%s' "$EXPECTED_CERT" | grep -Eqx '[0-9a-f]{64}'; then
            echo "::error::the release certificate is not pinned yet: write its SHA-256 into EXPECTED_CERT in .github/workflows/android-release.yml before the first tag"
            exit 1
          fi
          echo "cert=$EXPECTED_CERT" >> "$GITHUB_OUTPUT"

      # The keystore is decoded into RUNNER_TEMP, outside the workspace, so no artifact glob or
      # accidental `git add` can ever pick it up, and it is shredded straight after.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # zipalign first: the APK Signature Scheme covers the whole file, so nothing may move after
      # signing. The passwords reach apksigner as environment variables, never on its command
      # line. v1 (JAR) signing is off because minSdk 24 makes it dead weight, v2 covers Android
      # 7.0 and later, and v3 keeps key rotation possible later: the same schemes the Gradle
      # build's local signing config pins.
      - name: Align and sign with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          IN="$RUNNER_TEMP/handover/gdprletterbuilder-unsigned.apk"
          sha256sum -c --quiet "$RUNNER_TEMP/checked.sha256"
          "$BUILD_TOOLS/zipalign" -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "$RUNNER_TEMP/gdprletterbuilder-release.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/aligned.apk"

      - name: Remove keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.p12" || rm -f "$RUNNER_TEMP/release.p12"

      # Fails the release if signing went wrong, if the certificate is not the pinned one, or if
      # aligning and signing changed, added or dropped any file of the APK checked above.
      - name: Verify signature and certificate, and that signing changed no file
        env:
          EXPECTED_CERT: ${{ steps.pin.outputs.cert }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/gdprletterbuilder-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" -c 4 "$APK" > /dev/null || { echo "::error::the APK is not aligned"; exit 1; }
          CERTS=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERTS"

          # Exactly one signer, so the pin below speaks for the whole APK.
          if ! printf '%s\n' "$CERTS" | grep -qx 'Number of signers: 1'; then
            echo "::error::the APK must have exactly one signer"
            exit 1
          fi

          # PIN THE SIGNING CERTIFICATE, do not merely check that one exists. apksigner's exit
          # status catches an UNSIGNED apk, but an apk validly signed with the WRONG key passes it
          # and reaches the release. Android enforces certificate continuity, so publishing under
          # the wrong key permanently forks the install base: existing users would get
          # INSTALL_FAILED_UPDATE_INCOMPATIBLE and the only fix is uninstalling.
          printf '%s' "$EXPECTED_CERT" | grep -Eqx '[0-9a-f]{64}' || { echo "::error::no pinned certificate"; exit 1; }
          ACTUAL_CERT=$(printf '%s\n' "$CERTS" \
            | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::signing certificate mismatch"
            echo "  expected $EXPECTED_CERT"
            echo "  actual   $ACTUAL_CERT"
            exit 1
          fi
          echo "Signing certificate matches the pinned fingerprint."

          # The same files as the APK checked before signing: each name, size, CRC-32 and
          # compression, in the same order (v1 signing is off, so nothing is added to META-INF).
          python3 - "$RUNNER_TEMP/handover/gdprletterbuilder-unsigned.apk" "$APK" <<'PY'
          import sys, zipfile
          entries = [[(i.filename, i.file_size, i.CRC, i.compress_type) for i in zipfile.ZipFile(p).infolist()] for p in sys.argv[1:3]]
          if entries[0] != entries[1]:
              print("::error::signing changed the files of the APK that was checked")
              sys.exit(1)
          print(f"Verified: the signed APK holds the same {len(entries[1])} files as the APK checked before signing.")
          PY

      # Lets anyone prove this exact binary came out of this repository and this run:
      #   gh attestation verify gdprletterbuilder-v0.0.1.apk -R StormberryAS/GDPRLetterBuilder
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/gdprletterbuilder-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Strips only the "android-" prefix, so the tag android-v0.0.1 yields v0.0.1 and the
          # asset carries the v: gdprletterbuilder-v0.0.1.apk. Keep this in step with the `match`
          # pattern in zapstore.yaml: match: "gdprletterbuilder-.*\\.apk$"
          VERSION="${GITHUB_REF_NAME#android-}"
          cp "$RUNNER_TEMP/gdprletterbuilder-release.apk" "gdprletterbuilder-${VERSION}.apk"
          sha256sum "gdprletterbuilder-${VERSION}.apk" > "gdprletterbuilder-${VERSION}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "gdprletterbuilder-${VERSION}.apk" \
            "gdprletterbuilder-${VERSION}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GDPRLetterBuilder for Android ${VERSION}" \
            --generate-notes
