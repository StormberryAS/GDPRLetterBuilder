[versions]
# Pinned deliberately, every one an exact version, and kept the same as CheckLink's (the
# template of this project, released as 0.0.1 on 15 October 2026), so the Labs apps move
# together. A bump is a deliberate, reviewed act.
# Release-age rule (Marcos, since 2026-10-22, replacing the 14-day rule): stable releases only;
# a routine update waits until the release is 3 days old; a security fix that reaches this app
# goes in at once.
agp = "9.3.1"            # AGP 9.3.x: Gradle 9.5.0, JDK 17 minimum, built-in Kotlin 2.2.10
activity = "1.13.0"      # the release the template app and UsernameGenerator ship
coreKtx = "1.19.0"       # the release the template app and UsernameGenerator ship
webkit = "1.17.1"        # DEP-1, applied 2026-10-29: stable, released 2026-09-23 (Google Maven's
                         # Last-Modified for webkit-1.17.1.pom), 36 days old, so a routine update
                         # under the 3-day rule; as CheckLink since 0.0.2 (2026-10-22). Its one
                         # change: Kotlin removed from the library, so kotlin-stdlib now comes
                         # only through core-ktx and activity. 1.18.0 (2026-10-21, new APIs, no
                         # security fix) is for a later review, with CheckLink
junit = "4.13.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
