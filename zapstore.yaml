# Zapstore publishing manifest (https://zapstore.dev/docs/publish), modelled on CheckLink's
# (released 0.0.1 on 15 October 2026).
#
# `pubkey` is load-bearing, not decoration: on a first publish the Zapstore relay
# fetches this file from the repository and whitelists the key it finds here, so
# it must stay identical to the key `zsp` signs with (SIGN_WITH). It is the
# Stormberry AS nostr identity, the same one behind nostr.json at stormberry.as and
# in CheckLink's and EclipseTracker's zapstore.yaml. Derive the npub from the
# signing key and compare before the first publish.
#
# Publish a release with the config file, and only once the release workflow has
# finished and the GitHub release exists (zsp takes whatever release is there):
#   SIGN_WITH=<nsec|bunker://...> zsp publish zapstore.yaml
# Not `zsp publish -r ...`: that reads the repository instead of this file and
# drops the tags, the licence and the website.
repository: https://github.com/StormberryAS/GDPRLetterBuilder
pubkey: npub1zz9w77p2jkn95t0st9tcuea8zdn2vknf0ctrwyd4g46w3kswdccqesr0pa

name: GDPRLetterBuilder
summary: "Unofficial helper: write a GDPR access or erasure letter. Sends nothing."
description: |
  Not an official service. GDPRLetterBuilder is a free app made by Stormberry AS, a private company in Norway. It does not represent any government entity or public authority. It is not connected with the Norwegian Data Protection Authority (Datatilsynet), the European Data Protection Board (EDPB) or the European Union, and none of them has reviewed or approved it. It gives information, not legal advice.

  GDPRLetterBuilder fills in a letter asking a company to show you the personal data it holds about you (an access request, GDPR Article 15) or to erase it (an erasure request, GDPR Article 17), in English or in Norwegian (Bokmål). It counts the company's deadline, hands a reminder to your own calendar, and explains what you can do if they do not answer, or not fully, including how to complain to Datatilsynet.

  It sends nothing: you read the letter, change what you need and send it yourself.

  Official sources. The letters and notes rely on these. For the authoritative text, read them there:
  - The General Data Protection Regulation (GDPR), Regulation (EU) 2016/679, on EUR-Lex: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
  - The Norwegian Personal Data Act (personopplysningsloven), which makes the GDPR Norwegian law, in English on Lovdata: https://lovdata.no/dokument/NLE/lov/2018-06-15-38
  - Datatilsynet: https://www.datatilsynet.no/en/
  - Datatilsynet on complaints (in Norwegian): https://www.datatilsynet.no/om-datatilsynet/kontakt-oss/klage-til-datatilsynet/
  - EDPB Guidelines 01/2022 on the right of access: https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-012022-data-subject-rights-right-access_en
  The app lists every source it uses, with the date we checked it, in its last step.

  - What do you want? See what they hold, or have it deleted.
  - Who you are writing to, and about you. The company, how you will send it, and your own details. A warning shows if you type something that looks like a Norwegian national identity number or a payment card number. It warns and never blocks.
  - Your letter, live, in English or Bokmål. You can edit it before you send it.
  - Send it yourself. Copy it, open a draft in your email app, print it or save it as a PDF, save it as a text file, or share it.
  - Remember the deadline. One month from receipt, counted the way the EDPB describes, with weekends and Norwegian public holidays rolled over. Save a reminder file, or press Add to calendar app to hand the reminder to your calendar app. It holds the deadline and, unless you leave it out, the company's name; never your details.
  - If they do not answer, or not fully: what the law says, a follow-up letter, and a cover note with a dated timeline for a complaint to Datatilsynet.

  No permissions and no internet access. The app asks for no Android permission at all, so it cannot send anything anywhere: Android's App info for GDPRLetterBuilder lists none. Your letter leaves only when you press a button: to the clipboard, your email app, the printer, Android's save screen or the app you share it with.

  It keeps nothing you type, and no history of letters or companies. Closing the app empties every field. The only thing it stores is that you closed the first-run notice.

  The privacy page and the full disclaimer open from the app's footer. The code is open source (MIT): https://github.com/StormberryAS/GDPRLetterBuilder

  This is a functioning prototype from Stormberry AS, so expect gaps and changes.

tags:
  - privacy
  - gdpr
  - letters
  - offline
  - data-protection

license: MIT

# The app's own site, live since 30 October 2026 (0.0.2 points the listing at it,
# as CheckLink did once its site was live).
website: https://gdpr.stormberry.as

# The release text Zapstore shows for this version. Without this line zsp takes the
# GitHub release body, which the workflow leaves to GitHub's generated notes. A plain
# text file is used whole. Point it at the changelog of the versionCode being
# released, and change the number at every release (0.0.3 is versionCode 3).
release_notes: ./fastlane/metadata/android/en-US/changelogs/3.txt

# The APK ships no raster icon (the launcher icon is an adaptive-icon XML built
# from vectors), and a store front-end without a bitmap shows an empty tile. So
# the icon is supplied here, rendered by android/tools/build-store-icon.py from
# android/tools/launcher-icon.svg (ICON-1, draft C) with the launcher's own scale
# and offset.
icon: ./fastlane/metadata/android/en-US/images/icon.png

# Phone screenshots of the stage tree's app (the debug build: the same bundled page
# as the release APK) on an Android 16 emulator at 1080x1920, with a made-up company
# and person (Eksempel Handel AS, Kari Nordmann, example.com addresses), as 256-colour
# palette PNGs under 250 KB (Zapstore's Blossom server refuses images of about 700 KB).
# zsp uploads these to Blossom and references them from the app event.
images:
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/01-start.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/02-your-letter.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/03-deadline.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/04-follow-up.png

# No release_source: zsp pulls the APK straight from the GitHub release, so the
# asset URL in the nostr event points at the same signed binary the release page
# serves and the attestation covers. The release workflow uploads two files,
# gdprletterbuilder-v<version>.apk and gdprletterbuilder-v<version>.apk.sha256 (the
# tag android-v0.0.1 gives gdprletterbuilder-v0.0.1.apk). The pattern matches the
# APK and never the .sha256 file. Keep it in step with
# .github/workflows/android-release.yml.
match: "gdprletterbuilder-.*\\.apk$"
